<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPSSPP Matchmaker</title>
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <h1>PPSSPP Matchmaker</h1>
    <span id="statusBadge" class="status-badge offline">• Network Offline</span>

    <div class="card">
      <h3>Player Profile</h3>
      <input type="text" id="usernameInput" placeholder="Enter Gamer Tag (e.g. HunterX)" />
    </div>

    <div class="card">
      <h3>Host a Game</h3>
      <button id="createRoomBtn">Create Room</button>
    </div>

    <div class="card">
      <h3>Join a Game</h3>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="roomCodeInput" placeholder="CODE (E.G. 8541)" />
        <button id="joinRoomBtn">Join</button>
      </div>
    </div>

    <div class="card">
      <h3 id="outputText">Disconnected from session.</h3>
      <p id="playerCountText">Players in Room: 0/4</p>
      
      <div id="chatBox" style="height: 100px; overflow-y: auto; background: #1e1e1e; padding: 8px; border-radius: 5px; margin-bottom: 8px; text-align: left;">
        <p style="color: #888; margin: 2px 0;">System: Welcome to PPSSPP Matchmaker!</p>
      </div>
      
      <div style="display: flex; gap: 5px;">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <button id="sendChatBtn">Send</button>
      </div>
      
      <button id="leaveRoomBtn" style="background: #e63946; margin-top: 10px;">Leave Room</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
